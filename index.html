<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Evolve Neo — Studio Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-canvas: #F5F5F7;
      --bg-surface: #FFFFFF;
      --bg-subtle: #FAFAFC;
      --bg-obsidian: #111113;
      --bg-obsidian-soft: #1D1D1F;
      --border-hairline: #E5E5EA;
      --border-strong: #D2D2D7;
      --text-primary: #000000;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --status-ok-bg: #EEF7F0;
      --status-ok-fg: #14532D;
      --status-warn-bg: #F4F4F6;
      --status-warn-fg: #3A3A3C;
      --status-danger-bg: #FEF2F2;
      --status-danger-fg: #991B1B;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans Arabic', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    html[dir="ltr"] body {
      font-family: 'Inter', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Strict Apple / V14 non-blur surfaces */
    .surface-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 22px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .surface-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .hero-obsidian {
      background: var(--bg-obsidian);
      color: #FFFFFF;
      border: 1px solid #242428;
      border-radius: 24px;
    }
    .rail-shell {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .nav-pill-btn {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background-color 0.16s ease, color 0.16s ease;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .nav-pill-btn:hover { color: var(--text-primary); background: #F2F2F5; }
    .nav-pill-btn.active {
      background: var(--bg-obsidian);
      color: #FFFFFF;
    }

    .rail-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      position: relative;
    }
    .rail-btn:hover { background: #F2F2F5; color: var(--text-primary); }
    .rail-btn.active { background: var(--bg-obsidian); color: #FFFFFF; }

    .btn-primary {
      background: var(--bg-obsidian);
      color: #FFFFFF;
      border: 1px solid var(--bg-obsidian);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      min-height: 38px;
    }
    .btn-primary:hover { background: #262629; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      min-height: 38px;
    }
    .btn-secondary:hover { background: #F5F5F7; border-color: #B0B0B8; }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-ghost:hover { background: #EFEFF2; color: var(--text-primary); }

    .btn-danger {
      background: var(--status-danger-bg);
      color: var(--status-danger-fg);
      border: 1px solid #FECACA;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-danger:hover { background: #FEE2E2; }

    .input-field {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 13.5px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease;
      font-family: inherit;
    }
    .input-field:focus { border-color: #000000; }
    .input-field:disabled { background: #F5F5F7; color: #86868B; cursor: not-allowed; }

    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
      letter-spacing: 0.01em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
      color: var(--text-primary);
    }
    .badge-dark { background: #111113; color: #FFFFFF; border-color: #111113; }
    .badge-ok { background: var(--status-ok-bg); color: var(--status-ok-fg); border-color: #D1EAD7; }
    .badge-danger { background: var(--status-danger-bg); color: var(--status-danger-fg); border-color: #FECACA; }
    .badge-muted { background: #F2F2F5; color: #52525B; border-color: #E5E5EA; }

    /* Clean Apple tables */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .data-table th {
      text-align: start;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
      white-space: nowrap;
    }
    .data-table td {
      padding: 13px 16px;
      border-bottom: 1px solid #EFEFF2;
      vertical-align: middle;
    }
    .data-table tbody tr:hover { background: #FAFAFC; }
    .data-table tbody tr:last-child td { border-bottom: none; }

    /* Progress bar track */
    .segment-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }
    .segment-fill {
      height: 100%;
      border-radius: 999px;
      background: #FFFFFF;
      transition: width 0.3s ease;
    }

    /* A4 Editorial Invoice Preview Paper */
    .invoice-a4-paper {
      background: #FFFFFF;
      color: #000000;
      border: 1px solid #D2D2D7;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 794px;
      margin: 0 auto;
      padding: 42px 44px;
      font-size: 12.5px;
      line-height: 1.55;
    }

    /* Modal Backdrop (No Blur per strict directive) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 19, 0.48);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-sheet {
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: 24px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #111113;
      color: #FFFFFF;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 120;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      display: none;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 32px);
    }
    .toast-box.show { display: inline-flex; }

    /* Offscreen A4 Arabic PDF Render Stage */
    #pdfRenderStage {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 794px;
      background: #FFFFFF;
      color: #000000;
      z-index: -1;
      pointer-events: none;
    }

    /* Mobile safe spacing */
    @media (max-width: 900px) {
      .desktop-rail { display: none !important; }
      .desktop-top-nav { display: none !important; }
      .mobile-bottom-bar { display: flex !important; }
      .main-shell { padding-bottom: 84px !important; }
      .invoice-a4-paper { padding: 22px 18px; }
    }
    @media (min-width: 901px) {
      .mobile-bottom-bar { display: none !important; }
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D2D2D7; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #A1A1A6; }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Top Floating Pill Header (Dashboard V14 Spatial Architecture, Monochrome Apple Tokens) -->
    <header class="sticky top-0 z-40 px-4 md:px-6 pt-3 pb-2" style="background: var(--bg-canvas);">
      <div class="max-w-[1440px] mx-auto flex items-center justify-between gap-3">
        <!-- Brand Mark Pill -->
        <button type="button" onclick="navigate('overview')" class="surface-pill px-4 h-12 flex items-center gap-3 cursor-pointer shrink-0" aria-label="Evolve Neo Home">
          <span id="brandLogoMount" class="inline-flex items-center"></span>
          <span class="hidden sm:inline-block h-4 w-px bg-[#E5E5EA]"></span>
          <span class="hidden sm:inline-block text-[11px] font-semibold tracking-wider uppercase text-[#6E6E73]">Workspace</span>
        </button>

        <!-- Centered Segmented Navigation Pill (Desktop) -->
        <nav class="desktop-top-nav surface-pill p-1.5 flex items-center gap-1 overflow-x-auto max-w-[740px]" id="topNavPills" aria-label="Primary Navigation"></nav>

        <!-- End Utility Pill -->
        <div class="surface-pill p-1.5 flex items-center gap-1.5 shrink-0">
          <button type="button" onclick="openGlobalSearch()" class="rail-btn !w-9 !h-9" title="Search (Ctrl+K)" aria-label="Search">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <button type="button" onclick="toggleLanguage()" class="px-3 h-9 rounded-full text-xs font-semibold text-[#111113] hover:bg-[#F2F2F5] transition cursor-pointer border-0 bg-transparent" id="langToggleBtn">EN</button>
          <button type="button" onclick="navigate('settings')" class="rail-btn !w-9 !h-9" id="topSettingsBtn" title="Settings" aria-label="Settings">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          </button>
          <button type="button" onclick="openQuickCreateMenu()" class="btn-primary !py-0 !px-3.5 !min-h-0 h-9 text-xs">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden md:inline" data-i18n="quick_new">جديد</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Shell: Slim Floating Rail + Workspace Canvas -->
    <div class="main-shell flex-1 max-w-[1440px] w-full mx-auto px-4 md:px-6 pt-2 pb-10 flex gap-5">
      <!-- Slim Floating Vertical Rail (Dashboard V14 Inspired) -->
      <aside class="desktop-rail shrink-0 pt-2">
        <div class="sticky top-20 flex flex-col items-center gap-3">
          <div class="rail-shell p-1.5 flex flex-col items-center gap-1.5" id="sideRailPrimary"></div>
          <div class="rail-shell p-1.5 flex flex-col items-center gap-1.5" id="sideRailSecondary"></div>
        </div>
      </aside>

      <!-- Dynamic View Container -->
      <main id="mainView" class="flex-1 min-w-0"></main>
    </div>

    <!-- Mobile Bottom Navigation Bar (iPhone Ready, 44px tap targets) -->
    <nav class="mobile-bottom-bar fixed bottom-0 inset-x-0 z-50 bg-white border-t border-[#E5E5EA] px-2 py-1.5 justify-around items-center" id="mobileBottomNav"></nav>
  </div>

  <!-- Modal Container -->
  <div id="modalRoot"></div>

  <!-- Global Search Command Palette -->
  <div id="searchModalRoot"></div>

  <!-- Toast Feedback -->
  <div id="toastBox" class="toast-box" role="status" aria-live="polite"></div>

  <!-- Dedicated Off-screen Stage for High-DPI Arabic PDF Rendering -->
  <div id="pdfRenderStage"></div>

  <script>

    function getLogoSvgHtml(heightPx = 22) {
      return EVOLVE_SVG_RAW.replace('<svg ', `<svg style="height:${heightPx}px;width:auto;display:block;" `);
    }

    let cachedLogoPng = null;
    function getLogoPngDataUrl() {
      return new Promise((resolve) => {
        if (cachedLogoPng) return resolve(cachedLogoPng);
        try {
          const img = new Image();
          const blob = new Blob([EVOLVE_SVG_RAW], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 1230;
            canvas.height = 280;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 1230, 280);
            URL.revokeObjectURL(url);
            cachedLogoPng = canvas.toDataURL('image/png');
            resolve(cachedLogoPng);
          };
          img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
          img.src = url;
        } catch (e) { resolve(null); }
      });
    }

      try {

      } catch (e) {
        return new Date().toISOString().slice(0, 10);
      }
    };
    const nowIso = () => new Date().toISOString();

    function weekStart(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day);
      return d.toISOString().slice(0, 10);
    }
    function addDays(dateStr, n) {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);

    // Exact BigInt Monetary Math (ported & enhanced from Evolve Neo billing.ts)
    function currencyPrecision(c) {
      return ['BHD', 'KWD', 'OMR'].includes(c) ? 3 : 2;
    }
    function scaledBigInt(value, digits) {
      const n = Number(value || 0);
      if (!Number.isFinite(n) || n < 0 || n > 1e12) return 0n;
      const [mantissa, exp = '0'] = String(n).split(/[eE]/);
      const [whole, fraction = ''] = mantissa.split('.');
      const raw = whole + fraction;
      const pos = whole.length + Number(exp);
      const integral = pos <= 0 ? '0' : raw.slice(0, pos).padEnd(pos, '0');
      const fractional = pos <= 0 ? '0'.repeat(-pos) + raw : raw.slice(pos);
      let res = BigInt(integral || '0') * BigInt(10 ** digits) + BigInt(fractional.slice(0, digits).padEnd(digits, '0') || '0');
      if (Number(fractional[digits] || 0) >= 5) res += 1n;
      return res;
    }
    function roundDiv(n, d) {
      return (n + d / 2n) / d;
    }
    function calcInvoiceTotals(inv) {
      const digits = currencyPrecision(inv.currency || 'USD');
      const factor = 10 ** digits;
      const items = Array.isArray(inv.items) ? inv.items : [];
      const lineBigs = items.map(it => roundDiv(scaledBigInt(it.price, digits) * scaledBigInt(it.qty, 4), 10000n));
      const subtotalBig = lineBigs.reduce((a, b) => a + b, 0n);
      const discountBig = inv.discountType === 'percent'
        ? roundDiv(subtotalBig * scaledBigInt(inv.discountValue || 0, 4), 1000000n)
        : scaledBigInt(inv.discountValue || 0, digits);
      const clampedDiscount = discountBig > subtotalBig ? subtotalBig : discountBig;
      const baseBig = subtotalBig - clampedDiscount;
      const rateBig = scaledBigInt(inv.taxRate || 0, 4);
      const taxBig = inv.taxMode === 'inclusive'
        ? roundDiv(baseBig * rateBig, 1000000n + rateBig)
        : roundDiv(baseBig * rateBig, 1000000n);
      const totalBig = inv.taxMode === 'inclusive' ? baseBig : baseBig + taxBig;
      const depositBig = scaledBigInt(inv.deposit || 0, digits);
      const paymentsBig = (inv.payments || []).reduce((s, p) => s + scaledBigInt(p.amount, digits), 0n);
      const creditsBig = (inv.creditNotes || []).reduce((s, c) => s + scaledBigInt(c.amount, digits), 0n);
      const paidBig = depositBig + paymentsBig;
      const netDueBig = totalBig - paidBig - creditsBig;
      const dueBig = netDueBig < 0n ? 0n : netDueBig;
      const toNum = (b) => Number(b) / factor;
      return {
        digits,
        lines: lineBigs.map(toNum),
        subtotal: toNum(subtotalBig),
        discount: toNum(clampedDiscount),
        tax: toNum(taxBig),
        total: toNum(totalBig),
        paid: toNum(paidBig),
        credited: toNum(creditsBig),
        due: toNum(dueBig)
      };
    }
    function getInvoiceLifecycle(inv) {
      if (inv.status === 'void') return 'void';
      if (inv.status === 'draft' || !inv.issuedAt) return 'draft';
      const t = calcInvoiceTotals(inv);
      if (t.due <= 0 && t.total > 0) return 'paid';
      if (inv.due && inv.due < todayStr()) return 'overdue';
      if (t.paid > 0) return 'partial';
      if (inv.status === 'sent') return 'sent';
      return 'issued';
    }
    function formatMoney(val, currency = 'USD') {
      const d = currencyPrecision(currency);
      return `${Number(val || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })} ${currency}`;
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

      ta.select();

      // Payments History if present

        const wrapped = pdf.splitTextToSize(String(body).trim(), width);

        pdf.setDrawColor(229, 229, 234);

    async function generateArabicEditorialPdf(inv) {
      if (!window.jspdf || !window.jspdf.jsPDF || !window.html2canvas) throw new Error('PDF libraries unavailable');
      const stage = document.getElementById('pdfRenderStage');
      stage.innerHTML = buildInvoiceDocumentHtml(inv, true);
      await new Promise(r => setTimeout(r, 120));

      const canvas = await window.html2canvas(stage.firstElementChild, {
        scale: 2.5,
        backgroundColor: '#FFFFFF',
        useCORS: true,
        logging: false
      });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
      const pageWidth = 210;
      const pageHeight = 297;
      const margin = 0;
      const imgWidth = pageWidth - margin * 2;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      let heightLeft = imgHeight;
      let position = 0;
      const imgData = canvas.toDataURL('image/png', 1.0);

      pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft > 2) {
        position -= pageHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      stage.innerHTML = '';
      const safeName = `${(inv.number || 'invoice').replace(/[^a-zA-Z0-9_-]/g, '-')}-Evolve-Neo-AR.pdf`;
      pdf.save(safeName);
    }

    /* =========================================================================
       5. ENCRYPTED CREDENTIAL VAULT (AES-GCM 256-BIT + PBKDF2 600K)
       ========================================================================= */
    const u8ToB64 = (arr) => btoa(String.fromCharCode(...arr));
    const b64ToU8 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function deriveVaultKey(passphrase, saltBytes) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: saltBytes, iterations: 600000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function persistVaultItems() {
      if (!runtimeVaultKey) return;
      const salt = state.vault && state.vault.salt ? b64ToU8(state.vault.salt) : crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const dataBytes = new TextEncoder().encode(JSON.stringify(runtimeVaultItems));
      const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, runtimeVaultKey, dataBytes);
      state.vault = {
        salt: u8ToB64(salt),
        iv: u8ToB64(iv),
        cipher: u8ToB64(new Uint8Array(cipherBuf))
      };
      saveState();
    }

    async function setupOrUnlockVault(passphrase) {
      if (!passphrase || passphrase.length < 6) {
        showToast(t('كلمة مرور الخزنة يجب أن لا تقل عن 6 أحرف', 'Master passphrase must be at least 6 characters'));
        return;
      }
      try {
        if (!state.vault) {
          const salt = crypto.getRandomValues(new Uint8Array(16));
          runtimeVaultKey = await deriveVaultKey(passphrase, salt);
          runtimeVaultItems = [];
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, runtimeVaultKey, new TextEncoder().encode('[]'));
          state.vault = { salt: u8ToB64(salt), iv: u8ToB64(iv), cipher: u8ToB64(new Uint8Array(cipherBuf)) };
          addAudit('تم إنشاء وتشفير خزنة كلمات المرور (AES-GCM 256)', 'Initialized AES-GCM 256-bit Credential Vault', 'security');
          saveState();
          showToast(t('تم إنشاء الخزنة المشفرة بنجاح', 'Encrypted Vault initialized'));
          render();
        } else {
          const salt = b64ToU8(state.vault.salt);
          const iv = b64ToU8(state.vault.iv);
          const cipher = b64ToU8(state.vault.cipher);
          const key = await deriveVaultKey(passphrase, salt);
          const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
          runtimeVaultItems = JSON.parse(new TextDecoder().decode(plainBuf));
          runtimeVaultKey = key;
          showToast(t('تم فتح الخزنة المشفرة', 'Vault unlocked'));
          render();
        }
      } catch (e) {
        showToast(t('كلمة المرور الرئيسية غير صحيحة', 'Incorrect master passphrase'));
      }
    }

    function lockVault() {
      runtimeVaultKey = null;
      runtimeVaultItems = [];
      revealedCredId = null;
      showToast(t('تم قفل الخزنة', 'Vault locked'));
      render();
    }

    /* =========================================================================
       6. FIREBASE CLIENT BRIEFS LIVE SYNC (FROM USER'S index.html CONFIG)
       ========================================================================= */
    function parseFirestoreValue(valObj) {
      if (!valObj || typeof valObj !== 'object') return '';
      if ('stringValue' in valObj) return valObj.stringValue;
      if ('integerValue' in valObj) return valObj.integerValue;
      if ('doubleValue' in valObj) return String(valObj.doubleValue);
      if ('booleanValue' in valObj) return valObj.booleanValue ? 'yes' : 'no';
      if ('timestampValue' in valObj) return valObj.timestampValue;
      return '';
    }

    async function syncFirebaseBriefs() {
      briefsSyncStatus = 'loading';
      render();
      try {
        const res = await fetch(FIREBASE_BRIEFS_ENDPOINT);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const docs = Array.isArray(json.documents) ? json.documents : [];
        let importedCount = 0;
        docs.forEach(d => {
          const f = d.fields || {};
          const docId = d.name ? d.name.split('/').pop() : uid();
          const brief = {
            id: 'fb-' + docId,
            source: 'firebase',
            tracking_code: parseFirestoreValue(f.tracking_code) || docId.slice(0, 8).toUpperCase(),
            brand_name: parseFirestoreValue(f.brand_name) || 'Unnamed Brand',
            contact_person: parseFirestoreValue(f.contact_person),
            industry: parseFirestoreValue(f.industry),
            location: parseFirestoreValue(f.location),
            primary_phone: parseFirestoreValue(f.primary_phone),
            whatsapp_phone: parseFirestoreValue(f.whatsapp_phone),
            email: parseFirestoreValue(f.email),
            project_description: parseFirestoreValue(f.project_description),
            competitive_advantage: parseFirestoreValue(f.competitive_advantage),
            target_audience: parseFirestoreValue(f.target_audience),
            competitors: parseFirestoreValue(f.competitors),
            logo_type: parseFirestoreValue(f.logo_type),
            three_words: parseFirestoreValue(f.three_words),
            colors: parseFirestoreValue(f.colors),
            vibe_casual_formal: parseFirestoreValue(f.vibe_casual_formal) || '3',
            vibe_classic_modern: parseFirestoreValue(f.vibe_classic_modern) || '3',
            vibe_eco_premium: parseFirestoreValue(f.vibe_eco_premium) || '3',
            references: parseFirestoreValue(f.references),
            deadline: parseFirestoreValue(f.deadline),
            extra_notes: parseFirestoreValue(f.extra_notes),
            created_at: parseFirestoreValue(f.created_at) || d.createTime || nowIso()
          };
          const idx = state.briefs.findIndex(b => b.id === brief.id);
          if (idx >= 0) state.briefs[idx] = brief;
          else { state.briefs.unshift(brief); importedCount++; }
        });
        briefsSyncStatus = 'synced';
        addAudit(`تمت مزامنة ${docs.length} بريف من Firebase (${importedCount} جديد)`, `Synced ${docs.length} client briefs from Firebase (${importedCount} new)`, 'briefs');
        saveState();
        showToast(t(`تمت مزامنة ${docs.length} بريف من Firebase`, `Synced ${docs.length} briefs from Firebase`));
      } catch (err) {
        briefsSyncStatus = 'error';
        showToast(t('تعذّر الوصول المباشر لـ Firebase في هذه الجلسة؛ يمكنك إضافة بريف يدوياً أو استيراده.', 'Direct Firebase sync unavailable in this environment; manual briefs remain active.'));
      }
      render();
    }

    function convertBriefToProject(briefId) {
      const b = state.briefs.find(x => x.id === briefId);
      if (!b) return;
      let client = state.clients.find(c => c.name.toLowerCase() === (b.brand_name || '').toLowerCase());
      if (!client) {
        client = {
          id: uid(),
          code: nextClientCode(),
          name: b.brand_name || 'New Client',
          contact: b.contact_person || '',
          email: b.email || '',
          phone: b.primary_phone || b.whatsapp_phone || '',
          country: b.location || '',
          address: b.location || '',
          currency: 'USD',
          businessType: b.industry || '',
          website: '',
          socials: '',
          status: 'active',
          notes: `Converted from Brief ${b.tracking_code}`,
          createdAt: nowIso(),
          lastActivity: nowIso()
        };
        state.clients.unshift(client);
      }
      const code = nextProjectCode();
      const proj = {
        id: uid(),
        code,
        clientId: client.id,
        name: `${b.brand_name} — Brand Brief`,
        service: 'branding',
        status: 'new',
        priority: 1,
        startDate: todayStr(),
        deadline: /^\d{4}-\d{2}-\d{2}$/.test(b.deadline || '') ? b.deadline : '',
        deadlineConfirmed: false,
        budget: 0,
        currency: client.currency || 'USD',
        scope: b.project_description || '',
        confirmed: [b.three_words ? `Brand DNA: ${b.three_words}` : '', b.colors ? `Colors: ${b.colors}` : '', b.competitive_advantage ? `USP: ${b.competitive_advantage}` : ''].filter(Boolean).join('\n'),
        missing: b.deadline ? '' : 'تأكيد موعد التسليم والميزانية',
        decision: 'اعتماد خطة العمل ونطاق التسليمات',
        reply: '',
        links: b.references || '',
        notes: b.extra_notes || '',
        updates: [{ id: uid(), date: todayStr(), text: `تم إنشاء المشروع من بريف العميل (${b.tracking_code}).` }]
      };
      state.projects.unshift(proj);
      addAudit(`تم تحويل بريف ${b.brand_name} إلى مشروع ${code}`, `Converted brief ${b.brand_name} into project ${code}`, 'project');
      saveState();
      state.selectedProjectId = proj.id;
      navigate('projects');
      showToast(t(`تم إنشاء المشروع ${code} وربطه بالعميل`, `Created project ${code} and linked to client`));
    }

    function renderClientDetail(c) {
      const cProjects = state.projects.filter(p => p.clientId === c.id);
      const cInvoices = state.invoices.filter(i => i.clientId === c.id);
      const cContracts = state.contracts.filter(ct => ct.clientId === c.id);
      const cTasks = state.tasks.filter(tk => cProjects.some(p => p.id === tk.projectId));

      // Group financial metrics strictly by currency
      const finByCurr = {};
      cInvoices.filter(i => getInvoiceLifecycle(i) !== 'void').forEach(inv => {
        const cur = inv.currency || 'USD';
        if (!finByCurr[cur]) finByCurr[cur] = { invoiced: 0, paid: 0, due: 0 };
        const T = calcInvoiceTotals(inv);
        finByCurr[cur].invoiced += T.total;
        finByCurr[cur].paid += T.paid;
        finByCurr[cur].due += T.due;
      });

      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button type="button" onclick="state.selectedClientId=null;render()" class="btn-secondary !px-3">
                <i data-lucide="arrow-right" class="w-4 h-4"></i> ${t('العملاء', 'Clients')}
              </button>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-2xl font-bold text-black">${escapeHtml(c.name)}</h1>
                  <span class="mono badge">${escapeHtml(c.code)}</span>

                <p class="text-xs text-[#6E6E73] mt-0.5">${escapeHtml(c.contact || '')} ${c.businessType ? '· ' + escapeHtml(c.businessType) : ''}</p>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="openProjectModal(null, '${c.id}')" class="btn-secondary text-xs"><i data-lucide="folder-plus" class="w-3.5 h-3.5"></i> ${t('مشروع للعميل', 'Add Project')}</button>
              <button type="button" onclick="openInvoiceEditor(null, '${c.id}')" class="btn-primary text-xs"><i data-lucide="receipt" class="w-3.5 h-3.5"></i> ${t('إصدار فاتورة', 'Create Invoice')}</button>
              <button type="button" onclick="openClientModal('${c.id}')" class="btn-ghost text-xs">${t('تعديل البيانات', 'Edit')}</button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div class="surface-card lg:col-span-5 p-6 space-y-3 text-[13px]">
              <h2 class="text-sm font-bold text-black pb-2 border-b border-[#EFEFF2]">${t('بيانات العميل', 'Client Details')}</h2>
              <div class="grid grid-cols-2 gap-3">
                <div><span class="field-label">${t('المسؤول', 'Contact Person')}</span><div class="font-medium">${escapeHtml(c.contact || '-')}</div></div>
                <div><span class="field-label">${t('العملة المفضلة', 'Currency')}</span><div class="font-medium">${escapeHtml(c.currency || 'USD')}</div></div>
                <div><span class="field-label">${t('البريد الإلكتروني', 'Email')}</span><div class="font-medium break-all">${escapeHtml(c.email || t('غير مسجل', 'Not set'))}</div></div>
                <div><span class="field-label">${t('الهاتف / واتساب', 'Phone / WhatsApp')}</span><div class="font-medium tabular">${escapeHtml(c.phone || t('غير مسجل', 'Not set'))}</div></div>
                <div><span class="field-label">${t('البلد / العنوان', 'Location')}</span><div class="font-medium">${escapeHtml(c.address || c.country || '-')}</div></div>
                <div><span class="field-label">${t('الموقع', 'Website')}</span><div>${c.website ? `<a href="${escapeHtml(c.website)}" target="_blank" rel="noopener" class="underline text-black break-all">${escapeHtml(c.website)}</a>` : '-'}</div></div>
              </div>
              ${c.notes ? `<div class="pt-2 border-t border-[#EFEFF2]"><span class="field-label">${t('ملاحظات', 'Notes')}</span><p class="text-xs text-[#3A3A3C] leading-relaxed">${escapeHtml(c.notes)}</p></div>` : ''}
            </div>

            <div class="surface-card lg:col-span-7 p-6">
              <h2 class="text-sm font-bold text-black pb-2 border-b border-[#EFEFF2] mb-4">${t('الملخص المالي (مفصول حسب العملة)', 'Financial Summary (Per Currency)')}</h2>
              ${Object.keys(finByCurr).length ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${Object.entries(finByCurr).map(([cur, vals]) => `
                    <div class="p-4 rounded-2xl bg-[#FAFAFC] border border-[#E5E5EA]">
                      <div class="flex items-center justify-between mb-2">
                        <span class="badge badge-dark">${cur}</span>
                        <span class="text-xs text-[#6E6E73]">${cInvoices.filter(i => i.currency === cur).length} ${t('فواتير', 'invoices')}</span>

                      <div class="space-y-1.5 text-xs">

                <div class="p-3 rounded-xl bg-[#FAFAFC]"><div class="text-lg font-bold tabular">${cContracts.length}</div><div class="text-[11px] text-[#6E6E73]">${t('عقود', 'Contracts')}</div></div>
                <div class="p-3 rounded-xl bg-[#FAFAFC]"><div class="text-lg font-bold tabular">${cTasks.length}</div><div class="text-[11px] text-[#6E6E73]">${t('مهام', 'Tasks')}</div></div>
              </div>
            </div>
          </div>

          <!-- Linked Projects & Invoices -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                      <div class="text-[13px] font-bold text-black">${escapeHtml(p.name)}</div>
                      <div class="text-[11.5px] text-[#6E6E73] mono">${escapeHtml(p.code)} · ${t(getServiceObj(p.service).ar, getServiceObj(p.service).en)}</div>

            <div class="surface-card p-6">

                      </div>

                  `;

    /* =========================================================================
       10. VIEW: PROJECTS & UNIQUE IMMUTABLE CODES (EVN-YYYY-NNNN)
       ========================================================================= */
    function renderProjects() {
      if (state.selectedProjectId) {
        const prj = getProject(state.selectedProjectId);
        if (prj) return renderProjectDetail(prj);
        state.selectedProjectId = null;
      }

      const f = state.filters;
      const list = state.projects.filter(p => {
        if (f.client && p.clientId !== f.client) return false;
        if (f.service && p.service !== f.service) return false;
        if (f.status && p.status !== f.status) return false;
        if (f.search) {
          const q = f.search.toLowerCase();
          const c = getClient(p.clientId);
          if (![p.name, p.code, p.confirmed, p.missing, c ? c.name : ''].some(v => (v || '').toLowerCase().includes(q))) return false;
        }
        return true;
      }).sort((a, b) => (a.priority || 3) - (b.priority || 3));

      return `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-bold text-black">${t('المشاريع والأكواد المرجعية', 'Projects & Reference Codes')}</h1>
              <p class="text-xs text-[#6E6E73] mt-1">${t('كل مشروع يحصل تلقائياً على كود فريد ثابت (EVN-2026-XXXX) مرتبط بجميع الفواتير والعقود والمهام.', 'Every project receives an immutable sequential code (EVN-2026-XXXX) linked across invoices, contracts, and tasks.')}</p>
            </div>
            <button type="button" onclick="openProjectModal(null)" class="btn-primary self-start sm:self-auto">
              <i data-lucide="folder-plus" class="w-4 h-4"></i> ${t('مشروع جديد', 'New Project')}
            </button>
          </div>

          <!-- Unified Filters Bar -->

            <select onchange="setFilter('client', this.value)" class="input-field !w-auto min-w-[140px]">
              <option value="">${t('كل العملاء', 'All Clients')}</option>

            </select>
            <select onchange="setFilter('service', this.value)" class="input-field !w-auto min-w-[140px]">
              <option value="">${t('كل الخدمات', 'All Services')}</option>
              ${SERVICES.map(s => `<option value="${s.id}" ${f.service === s.id ? 'selected' : ''}>${t(s.ar, s.en)}</option>`).join('')}
            </select>
            <select onchange="setFilter('status', this.value)" class="input-field !w-auto min-w-[140px]">
              <option value="">${t('كل الحالات', 'All Statuses')}</option>
              ${state.statuses.map(s => `<option value="${s.id}" ${f.status === s.id ? 'selected' : ''}>${t(s.ar, s.en)}</option>`).join('')}
            </select>
            ${(f.client || f.service || f.status || f.search) ? `<button type="button" onclick="clearFilters()" class="btn-ghost text-xs">${t('مسح الفلاتر', 'Clear')}</button>` : ''}
          </div>

          <!-- Projects Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            ${list.map(p => {
              const c = getClient(p.clientId);
              const srv = getServiceObj(p.service);
              const st = getStatusObj(p.status);
              const taskCnt = state.tasks.filter(tk => tk.projectId === p.id && tk.status !== 'done').length;
              return `
                <article onclick="openProjectDetail('${p.id}')" class="surface-card p-5 flex flex-col justify-between gap-4 hover:border-black transition cursor-pointer">

                    <div class="flex items-center justify-between gap-2 mb-2">
                      <span class="mono text-[11px] font-semibold text-[#6E6E73]">${escapeHtml(p.code)}</span>
                      <span class="badge ${p.status === 'done' ? 'badge-ok' : p.status === 'decision' ? 'badge-dark' : ''}">${t(st.ar, st.en)}</span>
                    </div>
                    <h3 class="text-[16px] font-bold text-black leading-snug">${escapeHtml(p.name)}</h3>
                    <div class="text-xs text-[#6E6E73] mt-1">${c ? escapeHtml(c.name) : '-'} · ${t(srv.ar, srv.en)}</div>

                    <div class="mt-4 space-y-2 text-xs">
                      ${p.confirmed ? `<div class="p-2.5 rounded-xl bg-[#FAFAFC] border border-[#EFEFF2]"><span class="font-semibold text-black">${t('مؤكد:', 'Confirmed:')}</span> <span class="text-[#3A3A3C] line-clamp-2">${escapeHtml(p.confirmed)}</span></div>` : ''}
                      ${p.missing ? `<div class="p-2.5 rounded-xl bg-[#FEF2F2] border border-[#FECACA]"><span class="font-semibold text-[#991B1B]">${t('ناقص:', 'Missing:')}</span> <span class="text-[#7F1D1D] line-clamp-2">${escapeHtml(p.missing)}</span></div>` : ''}
                    </div>
                  </div>

                  <div class="pt-3 border-t border-[#EFEFF2] flex items-center justify-between text-xs text-[#6E6E73]">
                    <span class="tabular">${t('مهام مفتوحة:', 'Open tasks:')} <strong class="text-black">${taskCnt}</strong></span>
                    <span class="tabular">${p.deadline ? `${p.deadlineConfirmed ? t('مؤكد', 'Confirmed') : t('مبدئي', 'Target')} ${p.deadline}` : t('بدون موعد', 'No deadline')}</span>
                  </div>
                </article>
              `;
            }).join('') || `<div class="col-span-full surface-card p-10 text-center text-xs text-[#86868B]">${t('لا توجد مشاريع مطابقة.', 'No matching projects.')}</div>`}
          </div>
        </div>
      `;
    }

    function openProjectDetail(id) {
      state.selectedProjectId = id;
      state.activeTab = 'projects';
      saveState();
      render();
    }

    function renderProjectDetail(p) {
      const c = getClient(p.clientId);
      const pTasks = state.tasks.filter(tk => tk.projectId === p.id);
      const pInvoices = state.invoices.filter(i => i.projectId === p.id);
      const pContracts = state.contracts.filter(ct => ct.projectId === p.id);
      const linksList = (p.links || '').split(/\s+/).filter(l => /^https?:\/\//i.test(l));

      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button type="button" onclick="state.selectedProjectId=null;render()" class="btn-secondary !px-3">
                <i data-lucide="arrow-right" class="w-4 h-4"></i> ${t('المشاريع', 'Projects')}
              </button>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="mono badge badge-dark">${escapeHtml(p.code)}</span>
                  <h1 class="text-xl md:text-2xl font-bold text-black">${escapeHtml(p.name)}</h1>
                </div>
                <p class="text-xs text-[#6E6E73] mt-0.5">${c ? escapeHtml(c.name) : '-'} · ${t(getServiceObj(p.service).ar, getServiceObj(p.service).en)} · ${t('الأولوية', 'Priority')} P${p.priority || 2}</p>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="openTaskModal(null, '${p.id}')" class="btn-secondary text-xs"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ${t('مهمة', 'Task')}</button>
              <button type="button" onclick="openInvoiceEditor(null, '${p.clientId}', '${p.id}')" class="btn-primary text-xs"><i data-lucide="receipt" class="w-3.5 h-3.5"></i> ${t('فاتورة للمشروع', 'Invoice Project')}</button>
              <button type="button" onclick="openProjectModal('${p.id}')" class="btn-ghost text-xs">${t('تعديل', 'Edit')}</button>
            </div>
          </div>

          <!-- Confirmed vs Missing Breakdown -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="surface-card p-6 space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-black">${t('المعلومات المؤكدة ونطاق العمل', 'Confirmed Details & Scope')}</h2>
                <span class="badge badge-ok">${t('مؤكد', 'Confirmed')}</span>
              </div>
              <div class="text-[13px] text-[#1D1D1F] whitespace-pre-wrap leading-relaxed">${escapeHtml(p.confirmed || t('لا توجد معلومات مؤكدة مسجلة بعد.', 'No confirmed info recorded yet.'))}</div>
              ${p.scope ? `<div class="pt-3 border-t border-[#EFEFF2]"><span class="field-label">${t('نطاق العمل (Scope)', 'Scope of Work')}</span><p class="text-xs text-[#3A3A3C] whitespace-pre-wrap">${escapeHtml(p.scope)}</p></div>` : ''}
              <div class="grid grid-cols-2 gap-3 pt-3 border-t border-[#EFEFF2] text-xs">
                <div><span class="field-label">${t('موعد التسليم', 'Deadline')}</span><div class="font-semibold tabular">${p.deadline || t('غير محدد', 'TBD')} ${p.deadline ? (p.deadlineConfirmed ? `(${t('مؤكد', 'Confirmed')})` : `(${t('مبدئي', 'Tentative')})`) : ''}</div></div>
                <div><span class="field-label">${t('الميزانية المتفق عليها', 'Agreed Budget')}</span><div class="font-semibold tabular">${p.budget ? formatMoney(p.budget, p.currency || 'USD') : t('غير مسجل', 'Not set')}</div></div>
              </div>
            </div>

            <div class="surface-card p-6 space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-black">${t('النواقص والقرارات والردود المعلّقة', 'Missing Info, Decisions & Pending Replies')}</h2>
                <span class="badge badge-danger">${t('متابعة', 'Follow-up')}</span>
              </div>
              <div class="space-y-3 text-[13px]">
                <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#E5E5EA]">
                  <span class="field-label text-[#991B1B]">${t('ملفات أو معلومات ناقصة', 'Missing Files / Info')}</span>
                  <div class="text-[#1D1D1F]">${escapeHtml(p.missing || t('لا يوجد', 'None'))}</div>
                </div>
                <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#E5E5EA]">
                  <span class="field-label">${t('القرار المطلوب', 'Decision Required')}</span>
                  <div class="text-[#1D1D1F]">${escapeHtml(p.decision || t('لا يوجد', 'None'))}</div>
                </div>
                <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#E5E5EA]">
                  <span class="field-label">${t('الرد المعلّق من العميل', 'Pending Client Reply')}</span>
                  <div class="text-[#1D1D1F]">${escapeHtml(p.reply || t('لا يوجد', 'None'))}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Links, Tasks, Updates, Contracts & Invoices -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div class="surface-card lg:col-span-7 p-6 space-y-5">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-bold text-black">${t('مهام المشروع', 'Project Tasks')} (${pTasks.length})</h3>
                  <button type="button" onclick="openTaskModal(null, '${p.id}')" class="btn-ghost text-xs">+ ${t('إضافة مهمة', 'Add Task')}</button>
                </div>
                <div class="space-y-2">
                  ${pTasks.map(tk => `
                    <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#EFEFF2] flex items-center justify-between gap-3">
                      <div class="min-w-0">
                        <div class="text-[13px] font-semibold text-black">${escapeHtml(tk.title)}</div>
                        <div class="text-[11px] text-[#6E6E73] tabular">P${tk.priority} · ${tk.due || t('بدون موعد', 'No due date')}</div>
                      </div>
                      <select onchange="quickUpdateTaskStatus('${tk.id}', this.value)" class="input-field !w-auto !py-1 !px-2 !text-xs">
                        ${state.statuses.map(s => `<option value="${s.id}" ${tk.status === s.id ? 'selected' : ''}>${t(s.ar, s.en)}</option>`).join('')}
                      </select>
                    </div>
                  `).join('') || `<p class="text-xs text-[#86868B]">${t('لا توجد مهام مسجلة.', 'No tasks yet.')}</p>`}
                </div>
              </div>

              <div class="pt-4 border-t border-[#EFEFF2]">
                <h3 class="text-sm font-bold text-black mb-3">${t('سجل تحديثات المشروع والملاحظات', 'Project Updates & Notes')}</h3>
                <div class="flex gap-2 mb-3">
                  <input type="text" id="newProjectUpdateInput" placeholder="${t('أضف تحديثاً جديداً للمشروع...', 'Add a timestamped project update...')}" class="input-field" onkeydown="if(event.key==='Enter') addProjectUpdate('${p.id}')" />
                  <button type="button" onclick="addProjectUpdate('${p.id}')" class="btn-primary shrink-0">${t('إضافة', 'Add')}</button>
                </div>
                <div class="space-y-2">
                  ${(p.updates || []).map(u => `
                    <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#EFEFF2] text-xs">
                      <div class="text-[#86868B] tabular mb-1">${escapeHtml(u.date)}</div>
                      <div class="text-[#1D1D1F]">${escapeHtml(u.text)}</div>
                    </div>
                  `).join('') || `<p class="text-xs text-[#86868B]">${t('لا توجد تحديثات بعد.', 'No updates yet.')}</p>`}
                </div>
              </div>
            </div>

            <div class="surface-card lg:col-span-5 p-6 space-y-5">
              <div>
                <h3 class="text-sm font-bold text-black mb-2.5">${t('روابط المشروع والملفات', 'Project Links & Files')}</h3>
                ${linksList.length ? linksList.map(url => `
                  <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="flex items-center justify-between p-3 rounded-xl bg-[#FAFAFC] border border-[#E5E5EA] hover:border-black text-xs text-black mb-2 transition">
                    <span class="truncate">${escapeHtml(url)}</span>
                    <i data-lucide="external-link" class="w-3.5 h-3.5 shrink-0 ms-2"></i>
                  </a>
                `).join('') : `<p class="text-xs text-[#86868B]">${t('لا توجد روابط مضافة.', 'No links added.')}</p>`}
              </div>

              <div class="pt-4 border-t border-[#EFEFF2]">
                <div class="flex items-center justify-between mb-2.5">
                  <h3 class="text-sm font-bold text-black">${t('العقود المرتبطة', 'Linked Contracts')}</h3>
                  <button type="button" onclick="openContractModal(null, '${p.clientId}', '${p.id}')" class="btn-ghost text-xs">+ ${t('عقد', 'Contract')}</button>
                </div>
                ${pContracts.map(ct => `
                  <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#EFEFF2] text-xs flex items-center justify-between mb-2">
                    <span class="font-semibold text-black">${escapeHtml(ct.title)} (${escapeHtml(ct.version)})</span>
                    <span class="badge">${escapeHtml(ct.status)}</span>
                  </div>
                `).join('') || `<p class="text-xs text-[#86868B]">${t('لا توجد عقود مرتبطة.', 'No contracts attached.')}</p>`}
              </div>

              <div class="pt-4 border-t border-[#EFEFF2]">
                <div class="flex items-center justify-between mb-2.5">
                  <h3 class="text-sm font-bold text-black">${t('فواتير المشروع', 'Project Invoices')}</h3>
                  <button type="button" onclick="openInvoiceEditor(null, '${p.clientId}', '${p.id}')" class="btn-ghost text-xs">+ ${t('فاتورة', 'Invoice')}</button>
                </div>
                ${pInvoices.map(inv => {
                  const T = calcInvoiceTotals(inv);
                  return `
                    <div onclick="openInvoiceEditor('${inv.id}')" class="p-3 rounded-xl bg-[#FAFAFC] border border-[#EFEFF2] hover:border-black transition cursor-pointer text-xs flex items-center justify-between mb-2">
                      <div><strong class="text-black tabular">${escapeHtml(inv.number)}</strong><div class="text-[#6E6E73] tabular">${formatMoney(T.total, inv.currency)}</div></div>
                      <span class="badge">${getInvoiceLifecycle(inv).toUpperCase()}</span>
                    </div>
                  `;
                }).join('') || `<p class="text-xs text-[#86868B]">${t('لا توجد فواتير مرتبطة.', 'No invoices yet.')}</p>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function addProjectUpdate(projectId) {
      const input = document.getElementById('newProjectUpdateInput');
      if (!input || !input.value.trim()) return;
      const p = getProject(projectId);
      if (!p) return;
      p.updates = p.updates || [];
      p.updates.unshift({ id: uid(), date: todayStr(), text: input.value.trim() });
      addAudit(`تمت إضافة تحديث على المشروع ${p.code}`, `Added update on project ${p.code}`, 'project');
      saveState();
      render();
      showToast(t('تم حفظ التحديث', 'Update saved'));
    }

    /* =========================================================================
       11. VIEW: TASKS & OPERATIONS
       ========================================================================= */
    function renderTasks() {
      const f = state.filters;
      const wkStart = state.selectedWeek;
      const wkEnd = addDays(wkStart, 6);
      const today = todayStr();

      const tasks = state.tasks.filter(tk => {
        const p = getProject(tk.projectId);
        if (f.client && (!p || p.clientId !== f.client)) return false;
        if (f.service && (!p || p.service !== f.service)) return false;
        if (f.status && tk.status !== f.status) return false;
        if (f.weekOnly && (!tk.due || tk.due < wkStart || tk.due > wkEnd)) return false;
        if (f.search) {
          const q = f.search.toLowerCase();
          if (![tk.title, tk.notes, p ? p.name : '', p ? p.code : ''].some(v => (v || '').toLowerCase().includes(q))) return false;
        }
        return true;
      }).sort((a, b) => a.priority - b.priority);

      return `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-bold text-black">${t('إدارة المهام والعمليات', 'Tasks & Operations')}</h1>
              <p class="text-xs text-[#6E6E73] mt-1">${t('ترتيب المهام حسب الأولوية، التمييز بين المواعيد المؤكدة وغير المؤكدة، والفلترة متعددة الأبعاد.', 'Priority-sorted tasks with confirmed vs. tentative due dates and multi-dimensional filters.')}</p>
            </div>
            <button type="button" onclick="openTaskModal(null)" class="btn-primary self-start sm:self-auto">
              <i data-lucide="plus" class="w-4 h-4"></i> ${t('مهمة جديدة', 'New Task')}
            </button>
          </div>

          <div class="surface-card p-4 flex flex-wrap items-center gap-3">
            <input type="text" value="${escapeHtml(f.search)}" oninput="setFilter('search', this.value)" placeholder="${t('بحث في المهام...', 'Search tasks...')}" class="input-field !w-full sm:!w-52" />
            <select onchange="setFilter('client', this.value)" class="input-field !w-auto">
              <option value="">${t('كل العملاء', 'All Clients')}</option>
              ${state.clients.map(c => `<option value="${c.id}" ${f.client === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
            <select onchange="setFilter('service', this.value)" class="input-field !w-auto">
              <option value="">${t('كل الخدمات', 'All Services')}</option>
              ${SERVICES.map(s => `<option value="${s.id}" ${f.service === s.id ? 'selected' : ''}>${t(s.ar, s.en)}</option>`).join('')}
            </select>
            <select onchange="setFilter('status', this.value)" class="input-field !w-auto">
              <option value="">${t('كل الحالات', 'All Statuses')}</option>
              ${state.statuses.map(s => `<option value="${s.id}" ${f.status === s.id ? 'selected' : ''}>${t(s.ar, s.en)}</option>`).join('')}
            </select>
            <label class="inline-flex items-center gap-2 text-xs font-medium text-black cursor-pointer px-3 py-2 rounded-xl bg-[#F5F5F7]">
              <input type="checkbox" ${f.weekOnly ? 'checked' : ''} onchange="setFilter('weekOnly', this.checked)" />
              <span>${t('الأسبوع المحدد فقط', 'Selected week only')}</span>
            </label>
          </div>

          <div class="surface-card overflow-hidden">
            <div class="overflow-x-auto">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>${t('الأولوية', 'Priority')}</th>
                    <th>${t('المهمة', 'Task')}</th>
                    <th>${t('المشروع / العميل', 'Project / Client')}</th>
                    <th>${t('الحالة', 'Status')}</th>
                    <th>${t('تاريخ التسليم', 'Due Date')}</th>
                    <th>${t('إجراءات', 'Actions')}</th>
                  </tr>
                </thead>
                <tbody>
                  ${tasks.map(tk => {
                    const p = getProject(tk.projectId);
                    const c = p ? getClient(p.clientId) : null;
                    const isOver = tk.due && tk.due < today && tk.status !== 'done';
                    return `
                      <tr>
                        <td><span class="badge ${tk.priority === 1 ? 'badge-dark' : ''}">P${tk.priority}</span></td>
                        <td>
                          <div class="font-semibold text-black">${escapeHtml(tk.title)}</div>
                          ${tk.notes ? `<div class="text-xs text-[#6E6E73] mt-0.5">${escapeHtml(tk.notes)}</div>` : ''}
                        </td>
                        <td class="text-xs">
                          <div class="font-medium text-black">${p ? escapeHtml(p.name) : '-'}</div>
                          <div class="text-[#86868B]">${c ? escapeHtml(c.name) : ''} ${p ? '· ' + escapeHtml(p.code) : ''}</div>
                        </td>
                        <td>
                          <select onchange="quickUpdateTaskStatus('${tk.id}', this.value)" class="input-field !py-1.5 !px-2.5 !text-xs !w-auto">
                            ${state.statuses.map(s => `<option value="${s.id}" ${tk.status === s.id ? 'selected' : ''}>${t(s.ar, s.en)}</option>`).join('')}
                          </select>
                        </td>
                        <td class="tabular text-xs">
                          <div class="${isOver ? 'text-[#991B1B] font-bold' : 'text-black'}">${tk.due || t('غير محدد', 'TBD')}</div>
                          <div class="text-[11px] text-[#86868B]">${tk.confirmed ? t('موعد مؤكد', 'Confirmed') : t('غير مؤكد', 'Tentative')}</div>
                        </td>
                        <td>
                          <div class="flex items-center gap-1">
                            <button type="button" onclick="openTaskModal('${tk.id}')" class="btn-ghost !p-1.5" title="Edit"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                            <button type="button" onclick="confirmDelete('task', '${tk.id}')" class="btn-ghost !p-1.5 text-[#991B1B]" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('') || `<tr><td colspan="6" class="text-center py-10 text-xs text-[#86868B]">${t('لا توجد مهام مطابقة.', 'No matching tasks.')}</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function quickUpdateTaskStatus(taskId, newStatus) {
      const tk = state.tasks.find(x => x.id === taskId);
      if (!tk) return;
      tk.status = newStatus;
      addAudit(`تغيير حالة المهمة "${tk.title}" إلى ${getStatusObj(newStatus).ar}`, `Updated task "${tk.title}" status to ${getStatusObj(newStatus).en}`, 'task');
      saveState();
      render();
    }

    /* =========================================================================
       12. VIEW: ADVANCED INVOICING SYSTEM & LIVE EDITORIAL A4 PREVIEW
       ========================================================================= */
    function renderInvoices() {
      if (state.selectedInvoiceId) {
        const inv = state.invoices.find(i => i.id === state.selectedInvoiceId);
        if (inv) return renderInvoiceEditorView(inv);
        state.selectedInvoiceId = null;
      }

      const lifecycleBadge = (lc) => {
        if (lc === 'paid') return `<span class="badge badge-ok">${t('مدفوعة', 'Paid')}</span>`;
        if (lc === 'overdue') return `<span class="badge badge-danger">${t('متأخرة', 'Overdue')}</span>`;
        if (lc === 'void') return `<span class="badge badge-muted">${t('ملغاة', 'Void')}</span>`;
        if (lc === 'partial') return `<span class="badge badge-dark">${t('سداد جزئي', 'Partial')}</span>`;
        if (lc === 'issued' || lc === 'sent') return `<span class="badge">${lc === 'sent' ? t('مُرسلة', 'Sent') : t('معتمدة', 'Issued')}</span>`;
        return `<span class="badge badge-muted">${t('مسودة', 'Draft')}</span>`;
      };

      return `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

              <h1 class="text-2xl font-bold text-black">${t('منظومة الفواتير والمدفوعات', 'Invoicing & Billing Studio')}</h1>
              <p class="text-xs text-[#6E6E73] mt-1">${t('دورة حياة مالية منضبطة، حسابات BigInt دقيقة، سداد جزئي، إشعارات دائنة، وتصدير PDF مستقل بجودة A4.', 'Controlled invoice lifecycle, exact BigInt arithmetic, partial payments, credit notes, and standalone A4 PDF export.')}</p>
            </div>
            <button type="button" onclick="openInvoiceEditor(null)" class="btn-primary self-start sm:self-auto">
              <i data-lucide="file-plus" class="w-4 h-4"></i> ${t('فاتورة جديدة', 'New Invoice')}
            </button>
          </div>

          <div class="surface-card overflow-hidden">
            <div class="overflow-x-auto">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>${t('رقم الفاتورة', 'Invoice #')}</th>
                    <th>${t('العميل / المشروع', 'Client / Project')}</th>
                    <th>${t('الإصدار / الاستحقاق', 'Issue / Due')}</th>
                    <th>${t('الحالة', 'Lifecycle')}</th>
                    <th>${t('الإجمالي', 'Total')}</th>
                    <th>${t('المستحق', 'Balance Due')}</th>
                    <th>${t('إجراءات', 'Actions')}</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.invoices.map(inv => {
                    const T = calcInvoiceTotals(inv);
                    const lc = getInvoiceLifecycle(inv);
                    return `
                      <tr class="cursor-pointer" onclick="openInvoiceEditor('${inv.id}')">
                        <td class="mono font-bold text-black">${escapeHtml(inv.number)}</td>

                          <div class="font-semibold text-black">${escapeHtml(inv.clientName || '-')}</div>

                        </td>
                        <td class="tabular text-xs text-[#6E6E73]">
                          <div>${escapeHtml(inv.date)}</div>
                          <div>${inv.due ? t('استحقاق: ', 'Due: ') + escapeHtml(inv.due) : ''}</div>
                        </td>
                        <td>${lifecycleBadge(lc)}</td>
                        <td class="tabular font-semibold text-black">${formatMoney(T.total, inv.currency)}</td>

                        <td onclick="event.stopPropagation()">
                          <div class="flex items-center gap-1.5">
                            <button type="button" onclick="downloadInvoicePdf('${inv.id}')" class="btn-secondary !py-1.5 !px-3 !min-h-0 text-xs">
                              <i data-lucide="download" class="w-3.5 h-3.5"></i> PDF
                            </button>
                            <button type="button" onclick="openInvoiceEditor('${inv.id}')" class="btn-ghost !py-1.5 !px-2.5 text-xs">${t('فتح', 'Open')}</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('') || `<tr><td colspan="7" class="text-center py-10 text-xs text-[#86868B]">${t('لا توجد فواتير بعد.', 'No invoices yet.')}</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function openInvoiceEditor(invoiceId, presetClientId = '', presetProjectId = '') {
      if (invoiceId) {
        state.selectedInvoiceId = invoiceId;
      } else {
        const c = presetClientId ? getClient(presetClientId) : null;
        const p = presetProjectId ? getProject(presetProjectId) : null;
        const base = todayStr();
        const newInv = {
          id: uid(),
          number: nextInvoiceNumber(),
          status: 'draft',
          language: 'en', // Default English per user specification
          date: base,
          due: addDays(base, 14),
          clientId: c ? c.id : '',
          clientName: c ? c.name : '',
          clientEmail: c ? c.email : '',
          clientAddress: c ? (c.address || c.country) : '',
          clientTaxId: '',
          projectId: p ? p.id : '',
          projectCode: p ? p.code : '',
          projectName: p ? p.name : '',
          purchaseOrder: '',
          currency: (p && p.currency) || (c && c.currency) || 'USD',
          localCurrency: 'EGP',
          localAmount: '',
          items: [{ id: uid(), title: p ? p.name : '', category: 'Service', qty: 1, price: p && p.budget ? p.budget : 0 }],
          discountType: 'fixed',
          discountValue: 0,
          taxRate: 0,
          taxMode: 'exclusive',
          taxLabel: 'VAT',
          deposit: 0,
          payments: [],
          creditNotes: [],
          paymentInstructions: state.company.paymentInstructions || '',
          terms: state.company.defaultTerms || '',
          notes: '',
          issuedAt: '',
          frozenSnapshot: null
        };
        state.invoices.unshift(newInv);
        state.selectedInvoiceId = newInv.id;
        addAudit(`تم إنشاء مسودة الفاتورة ${newInv.number}`, `Created draft invoice ${newInv.number}`, 'invoice');
        saveState();
      }
      state.activeTab = 'invoices';
      render();
    }

                    <label class="field-label">${t('تاريخ الاستحقاق', 'Due Date')}</label>

              <div class="surface-card p-5 space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="text-sm font-bold text-black">${t('بنود الخدمات والتكاليف', 'Services, Materials & Billable Items')}</h2>
                  ${!isLocked ? `<button type="button" onclick="addInvoiceItem('${inv.id}')" class="btn-secondary !py-1 !px-3 !min-h-0 text-xs">+ ${t('إضافة بند', 'Add Item')}</button>` : ''}
                </div>
                <div class="space-y-2.5">
                  ${(inv.items || []).map((item, idx) => `
                    <div class="p-3 rounded-2xl bg-[#FAFAFC] border border-[#E5E5EA] space-y-2">
                      <div class="flex items-center gap-2">
                        <input type="text" class="input-field flex-1" ${isLocked ? 'disabled' : ''} value="${escapeHtml(item.title)}" oninput="updateInvItem('${inv.id}',${idx},'title',this.value)" placeholder="${t('وصف الخدمة أو البند...', 'Service or deliverable description...')}" />
                        ${!isLocked && inv.items.length > 1 ? `<button type="button" onclick="removeInvoiceItem('${inv.id}',${idx})" class="btn-ghost !p-2 text-[#991B1B]"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                      </div>

                          <input type="number" step="any" min="0" class="input-field !py-1.5 tabular" ${isLocked ? 'disabled' : ''} value="${item.price}" oninput="updateInvItem('${inv.id}',${idx},'price',Number(this.value))" />
                        </div>
                      </div>
                    </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">

                    <label class="field-label">${t('العملة المحلية (للعرض)', 'Local Currency')}</label>
                    <select class="input-field" ${isLocked ? 'disabled' : ''} onchange="updateInvField('${inv.id}','localCurrency',this.value,true)">
                      ${CURRENCIES.map(cur => `<option value="${cur}" ${(inv.localCurrency || 'EGP') === cur ? 'selected' : ''}>${cur}</option>`).join('')}

                  </div>
                  <div>

                      <option value="fixed" ${inv.discountType === 'fixed' ? 'selected' : ''}>${t('مبلغ ثابت', 'Fixed Amount')}</option>
                      <option value="percent" ${inv.discountType === 'percent' ? 'selected' : ''}>${t('نسبة %', 'Percent %')}</option>
                    </select>
                  </div>
                  <div>
                    <label class="field-label">${t('قيمة الخصم', 'Discount Value')}</label>
                    <input type="number" step="any" min="0" class="input-field tabular" ${isLocked ? 'disabled' : ''} value="${inv.discountValue || 0}" oninput="updateInvField('${inv.id}','discountValue',Number(this.value))" />
                  </div>
                  <div>
                    <label class="field-label">${t('الضريبة %', 'Tax Rate %')}</label>
                    <input type="number" step="any" min="0" max="100" class="input-field tabular" ${isLocked ? 'disabled' : ''} value="${inv.taxRate || 0}" oninput="updateInvField('${inv.id}','taxRate',Number(this.value))" />

                </div>
                <div class="grid grid-cols-1 gap-3 pt-2">
                  <div>
                    <label class="field-label">${t('تعليمات الدفع والتحويل', 'Payment Instructions')}</label>
                    <textarea rows="2" class="input-field" ${isLocked ? 'disabled' : ''} oninput="updateInvField('${inv.id}','paymentInstructions',this.value)">${escapeHtml(inv.paymentInstructions || '')}</textarea>
                  </div>
                  <div>
                    <label class="field-label">${t('شروط الدفع', 'Terms')}</label>
                    <textarea rows="2" class="input-field" ${isLocked ? 'disabled' : ''} oninput="updateInvField('${inv.id}','terms',this.value)">${escapeHtml(inv.terms || '')}</textarea>
                  </div>
                  <div>
                    <label class="field-label">${t('ملاحظات الفاتورة', 'Notes')}</label>
                    <textarea rows="2" class="input-field" ${isLocked ? 'disabled' : ''} oninput="updateInvField('${inv.id}','notes',this.value)">${escapeHtml(inv.notes || '')}</textarea>
                  </div>

              </div>

              <!-- Payments & Credit Notes History -->
              ${((inv.payments || []).length > 0 || (inv.creditNotes || []).length > 0) ? `
                <div class="surface-card p-5 space-y-3">
                  <h2 class="text-sm font-bold text-black">${t('المدفوعات والإشعارات الدائنة المسجلة', 'Recorded Payments & Credit Notes')}</h2>
                  ${(inv.payments || []).map(p => `
                    <div class="p-3 rounded-xl bg-[#EEF7F0] border border-[#D1EAD7] flex items-center justify-between text-xs">
                      <div><strong class="text-[#14532D] tabular">${formatMoney(p.amount, inv.currency)}</strong> · ${escapeHtml(p.method)} ${p.reference ? `(${escapeHtml(p.reference)})` : ''}</div>
                      <span class="tabular text-[#14532D]">${escapeHtml(p.date)}</span>
                    </div>
                  `).join('')}
                  ${(inv.creditNotes || []).map(cn => `
                    <div class="p-3 rounded-xl bg-[#FAFAFC] border border-[#E5E5EA] flex items-center justify-between text-xs">
                      <div><strong class="mono">${escapeHtml(cn.number)}</strong> · -${formatMoney(cn.amount, inv.currency)} · ${escapeHtml(cn.reason)}</div>
                      <span class="tabular text-[#6E6E73]">${escapeHtml(cn.date)}</span>

              ` : ''}

            <!-- Right/End: Live A4 Editorial Preview -->
            <div class="xl:col-span-6 space-y-3">
              <div class="flex items-center justify-between px-1">

                <span class="text-xs font-bold tabular text-black">${t('المستحق:', 'Due:')} ${formatMoney(T.due, inv.currency)}</span>
              </div>
              <div id="liveInvoicePreview">${buildInvoiceDocumentHtml(inv, false)}</div>
            </div>
          </div>

      `;

    function updateInvField(id, field, val, shouldRender = false) {
      const inv = state.invoices.find(i => i.id === id);
      if (!inv || getInvoiceLifecycle(inv) !== 'draft') return;
      inv[field] = val;
      saveState();
      if (shouldRender) render();
      else refreshInvoicePreview(inv);
    }

    function updateInvItem(id, idx, field, val, shouldRender = false) {
      const inv = state.invoices.find(i => i.id === id);
      if (!inv || getInvoiceLifecycle(inv) !== 'draft' || !inv.items[idx]) return;
      inv.items[idx][field] = val;
      saveState();
      if (shouldRender) render();
      else refreshInvoicePreview(inv);
    }

    function refreshInvoicePreview(inv) {
      const el = document.getElementById('liveInvoicePreview');
      if (el) el.innerHTML = buildInvoiceDocumentHtml(inv, false);
    }

    function linkInvoiceClient(invId, clientId) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv || getInvoiceLifecycle(inv) !== 'draft') return;
      const c = getClient(clientId);
      inv.clientId = clientId;
      if (c) {
        inv.clientName = c.name;
        inv.clientEmail = c.email || '';
        inv.clientAddress = c.address || c.country || '';
        if (c.currency) inv.currency = c.currency;
      }
      saveState();
      render();
    }

    function linkInvoiceProject(invId, projectId) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv || getInvoiceLifecycle(inv) !== 'draft') return;
      const p = getProject(projectId);
      inv.projectId = projectId;
      if (p) {
        inv.projectCode = p.code;
        inv.projectName = p.name;
        if (!inv.clientId && p.clientId) linkInvoiceClient(invId, p.clientId);
      } else {
        inv.projectCode = '';
        inv.projectName = '';
      }
      saveState();
      render();
    }

    function addInvoiceItem(invId) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv || getInvoiceLifecycle(inv) !== 'draft') return;
      inv.items.push({ id: uid(), title: '', category: 'Service', qty: 1, price: 0 });
      saveState();
      render();
    }

    function removeInvoiceItem(invId, idx) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv || getInvoiceLifecycle(inv) !== 'draft' || inv.items.length <= 1) return;
      inv.items.splice(idx, 1);
      saveState();
      render();
    }

    function issueInvoice(invId) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv) return;
      if (!inv.clientName.trim()) {
        showToast(t('يرجى إدخال اسم العميل قبل الاعتماد', 'Please enter client name before finalizing'));
        return;
      }
      if (!inv.items.length || inv.items.some(x => !x.title.trim() || x.qty <= 0 || x.price < 0)) {
        showToast(t('تحقق من اكتمال بنود الخدمات والأسعار', 'Please verify all line items and prices'));
        return;
      }
      inv.status = 'issued';
      inv.issuedAt = nowIso();
      // Freeze an immutable snapshot so archive PDF never drifts if company settings change
      inv.frozenSnapshot = JSON.parse(JSON.stringify({ ...inv, companySnapshot: { ...state.company }, frozenSnapshot: null }));
      addAudit(`تم اعتماد وإصدار الفاتورة ${inv.number} وحفظ النسخة الثابتة`, `Finalized & issued invoice ${inv.number} with frozen snapshot`, 'invoice');
      saveState();
      render();
      showToast(t(`تم اعتماد الفاتورة ${inv.number} بنجاح`, `Invoice ${inv.number} finalized`));
    }

    function createInvoiceRevision(invId) {
      const orig = state.invoices.find(i => i.id === invId);
      if (!orig) return;
      const revNum = `${orig.number.replace(/-R\d+$/, '')}-R${state.invoices.filter(x => x.number.startsWith(orig.number.replace(/-R\d+$/, ''))).length}`;
      const rev = JSON.parse(JSON.stringify(orig));
      rev.id = uid();
      rev.number = revNum;
      rev.status = 'draft';
      rev.issuedAt = '';
      rev.frozenSnapshot = null;
      rev.payments = [];
      rev.creditNotes = [];
      state.invoices.unshift(rev);
      state.selectedInvoiceId = rev.id;
      addAudit(`تم إنشاء نسخة مصحّحة ${revNum} من الفاتورة ${orig.number}`, `Created revision ${revNum} from ${orig.number}`, 'invoice');
      saveState();
      render();
      showToast(t(`تم إنشاء النسخة المصحّحة ${revNum}`, `Created revision ${revNum}`));
    }

    function confirmVoidInvoice(invId) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv) return;
      openModal(t('تأكيد إلغاء الفاتورة (Void)', 'Confirm Void Invoice'), `
        <p class="text-sm text-[#3A3A3C] mb-4">${t(`سيتم تغيير حالة الفاتورة ${inv.number} إلى ملغاة (Void) مع الاحتفاظ بها في السجل المالي دون حذف.`, `Invoice ${inv.number} will be marked Void while preserving the financial audit trail.`)}</p>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="btn-secondary">${t('تراجع', 'Cancel')}</button>
          <button type="button" onclick="voidInvoiceNow('${inv.id}')" class="btn-danger">${t('تأكيد الإلغاء', 'Confirm Void')}</button>
        </div>
      `);
    }
    function voidInvoiceNow(invId) {
      const inv = state.invoices.find(i => i.id === invId);
      if (!inv) return;
      inv.status = 'void';
      addAudit(`تم إلغاء الفاتورة ${inv.number} (Void)`, `Voided invoice ${inv.number}`, 'invoice');
      saveState();
      closeModal();
      render();
      showToast(t('تم إلغاء الفاتورة', 'Invoice voided'));
    }

    /* =========================================================================
       16. VIEW: FINANCIAL OVERVIEW & MULTI-CURRENCY REPORTS
       ========================================================================= */
    function renderReports() {
      const byCurrency = {};
      state.invoices.filter(i => getInvoiceLifecycle(i) !== 'void').forEach(inv => {
        const cur = inv.currency || 'USD';
        if (!byCurrency[cur]) byCurrency[cur] = { invoiced: 0, collected: 0, outstanding: 0, overdue: 0, expenses: 0 };
        const T = calcInvoiceTotals(inv);
        const lc = getInvoiceLifecycle(inv);
        byCurrency[cur].invoiced += T.total;
        byCurrency[cur].collected += T.paid;
        byCurrency[cur].outstanding += T.due;
        if (lc === 'overdue') byCurrency[cur].overdue += T.due;
      });
      state.expenses.forEach(exp => {
        const cur = exp.currency || 'USD';
        if (!byCurrency[cur]) byCurrency[cur] = { invoiced: 0, collected: 0, outstanding: 0, overdue: 0, expenses: 0 };
        byCurrency[cur].expenses += Number(exp.amount || 0);
      });

      return `

            <div>
              <h1 class="text-2xl font-bold text-black">${t('التقارير المالية والمصروفات', 'Financial Overview & Reports')}</h1>

            </div>
            <div class="overflow-x-auto">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>${t('العملة', 'Currency')}</th>
                    <th>${t('إجمالي المفوتر', 'Total Invoiced')}</th>
                    <th>${t('إجمالي المتحصل', 'Total Collected')}</th>
                    <th>${t('الرصيد المستحق', 'Outstanding')}</th>
