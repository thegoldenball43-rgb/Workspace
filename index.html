                  </tr>
                </thead>
                <tbody>
                  ${Object.entries(byCurrency).map(([cur, v]) => `
                    <tr>
                      <td><span class="badge badge-dark">${cur}</span></td>
                      <td class="tabular font-semibold">${formatMoney(v.invoiced, cur)}</td>
                      <td class="tabular font-semibold text-[#14532D]">${formatMoney(v.collected, cur)}</td>
                      <td class="tabular font-semibold">${formatMoney(v.outstanding, cur)}</td>
                      <td class="tabular font-semibold ${v.overdue > 0 ? 'text-[#991B1B]' : 'text-[#86868B]'}">${formatMoney(v.overdue, cur)}</td>
                      <td class="tabular text-[#6E6E73]">${formatMoney(v.expenses, cur)}</td>

      state.company.name = document.getElementById('setCoName').value.trim() || 'Evolve Neo';
      state.company.tagline = document.getElementById('setCoTag').value.trim();
      state.company.email = document.getElementById('setCoEmail').value.trim();
      state.company.website = document.getElementById('setCoWeb').value.trim();
      state.company.address = document.getElementById('setCoAddr').value.trim();
      state.company.taxId = document.getElementById('setCoTax').value.trim();
      state.company.paymentInstructions = document.getElementById('setCoPay').value.trim();
      state.company.defaultTerms = document.getElementById('setCoTerms').value.trim();
      addAudit('تم تحديث إعدادات هوية الاستوديو', 'Updated studio billing identity', 'settings');
      saveState();
      showToast(t('تم حفظ الإعدادات', 'Settings saved'));
    }

    function addCustomStatus() {
      const ar = document.getElementById('newStatusAr').value.trim();
      const en = document.getElementById('newStatusEn').value.trim();
      if (!ar || !en) { showToast(t('أدخل الاسم بالعربية والإنجليزية', 'Enter both Arabic and English labels')); return; }
      const id = 'st_' + en.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + Date.now().toString(36).slice(-3);
      state.statuses.push({ id, ar, en });
      addAudit(`تمت إضافة حالة مخصصة: ${ar}`, `Added custom status: ${en}`, 'settings');
      saveState();
      render();
      showToast(t('تمت إضافة الحالة', 'Status added'));
    }

    function exportWorkspaceJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `evolve-neo-workspace-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(t('تم تصدير النسخة الاحتياطية JSON', 'JSON backup downloaded'));
    }

    function importWorkspaceJson(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed.clients) || !Array.isArray(parsed.projects)) throw new Error('Invalid schema');
          state = { ...createInitialState(), ...parsed };
          saveState();
          render();
          showToast(t('تم استيراد البيانات بنجاح', 'Workspace imported successfully'));
        } catch (e) {
          showToast(t('ملف JSON غير صالح', 'Invalid JSON backup file'));
        }
      };
      reader.readAsText(file);
    }

      e.preventDefault();
      const name = document.getElementById('cfName').value.trim();

      if (!id && state.clients.some(x => x.name.toLowerCase() === name.toLowerCase())) {
        showToast(t('تنبيه: يوجد عميل بنفس الاسم بالفعل', 'Warning: Duplicate client name detected'));

      const payload = {

        phone: document.getElementById('cfPhone').value.trim(),
        country: document.getElementById('cfAddr').value.trim(),

        currency: document.getElementById('cfCurr').value,
        businessType: document.getElementById('cfType').value.trim(),
        website: document.getElementById('cfWeb').value.trim(),
        notes: document.getElementById('cfNotes').value.trim(),
        lastActivity: nowIso()
      };
      if (id) {
        Object.assign(getClient(id), payload);
        addAudit(`تم تحديث بيانات العميل ${name}`, `Updated client ${name}`, 'client');
      } else {
        const code = nextClientCode();
        state.clients.unshift({ id: uid(), code, status: 'active', socials: '', createdAt: nowIso(), ...payload });
        addAudit(`تمت إضافة العميل ${name} (${code})`, `Created client ${name} (${code})`, 'client');

      saveState();
      closeModal();
      render();
      showToast(t('تم حفظ بيانات العميل', 'Client saved'));
    }

    function saveContractForm(e) {
      e.preventDefault();
      const fileInput = document.getElementById('ctFile');
      const file = fileInput.files && fileInput.files[0];
      const baseRecord = {
        id: uid(),
        title: document.getElementById('ctTitle').value.trim(),
        clientId: document.getElementById('ctClient').value,
        projectId: document.getElementById('ctProj').value,
        category: document.getElementById('ctCat').value,
        status: document.getElementById('ctStatus').value,
        version: document.getElementById('ctVer').value.trim() || 'v1.0',
        addedDate: todayStr(),
        signedDate: document.getElementById('ctSigned').value,
        externalUrl: document.getElementById('ctUrl').value.trim(),
        notes: document.getElementById('ctNotes').value.trim(),
        fileName: '', fileSize: 0, fileType: '', fileDataUrl: ''
      };
      const commit = (rec) => {
        state.contracts.unshift(rec);
        addAudit(`تمت إضافة المستند "${rec.title}"`, `Added document "${rec.title}"`, 'contract');
        saveState();
        closeModal();
        render();
        showToast(t('تم حفظ المستند', 'Document saved'));
      };
      if (file) {
        if (file.size > 2 * 1024 * 1024) {
          showToast(t('الحد الأقصى لحجم الملف في المتصفح 2MB. استخدم الرابط الخارجي للملفات الأكبر.', 'Browser storage limit is 2MB. Use external link for larger files.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          baseRecord.fileName = file.name;
          baseRecord.fileSize = file.size;
          baseRecord.fileType = file.type;
          baseRecord.fileDataUrl = reader.result;
          commit(baseRecord);
        };
        reader.readAsDataURL(file);
      } else {
        commit(baseRecord);
      }
    }

    function renderGlobalSearchResults(q) {
      const box = document.getElementById('globalSearchResults');
      if (!box) return;
      const query = (q || '').toLowerCase().trim();
      const results = [];
      state.clients.forEach(c => {
        if (!query || [c.name, c.code, c.contact, c.email].some(v => (v || '').toLowerCase().includes(query)))
          results.push({ type: t('عميل', 'Client'), title: c.name, sub: c.code, action: `closeGlobalSearch();state.selectedClientId='${c.id}';navigate('clients')` });
      });
      state.projects.forEach(p => {
        if (!query || [p.name, p.code, p.confirmed, p.missing].some(v => (v || '').toLowerCase().includes(query)))
          results.push({ type: t('مشروع', 'Project'), title: p.name, sub: p.code, action: `closeGlobalSearch();openProjectDetail('${p.id}')` });
      });
      state.invoices.forEach(inv => {
        if (!query || [inv.number, inv.clientName, inv.projectCode].some(v => (v || '').toLowerCase().includes(query)))
          results.push({ type: t('فاتورة', 'Invoice'), title: inv.number, sub: inv.clientName, action: `closeGlobalSearch();openInvoiceEditor('${inv.id}')` });
      });
      state.tasks.forEach(tk => {
        if (!query || (tk.title || '').toLowerCase().includes(query))
          results.push({ type: t('مهمة', 'Task'), title: tk.title, sub: 'P' + tk.priority, action: `closeGlobalSearch();navigate('tasks')` });
      });

      box.innerHTML = results.slice(0, 15).map(r => `
        <button type="button" onclick="${r.action}" class="w-full p-3 rounded-xl hover:bg-[#F5F5F7] flex items-center justify-between text-start border-0 bg-transparent cursor-pointer">
          <div><div class="text-sm font-semibold text-black">${escapeHtml(r.title)}</div><div class="text-xs text-[#6E6E73] mono">${escapeHtml(r.sub || '')}</div></div>
          <span class="badge">${r.type}</span>
        </button>
      `).join('') || `<div class="p-6 text-center text-xs text-[#86868B]">${t('لا توجد نتائج مطابقة.', 'No matching results.')}</div>`;
    }

    function setFilter(key, val) {
      state.filters[key] = val;
      render();
    }
    function clearFilters() {
      state.filters = { client: '', service: '', status: '', weekOnly: false, search: '' };
      render();
    }

    /* =========================================================================
       20. MAIN RENDER LOOP & KEYBOARD SHORTCUTS
       ========================================================================= */
    function render() {
      renderNavigation();
      const main = document.getElementById('mainView');
      const tab = state.activeTab;
      if (tab === 'overview') main.innerHTML = renderOverview();
      else if (tab === 'clients') main.innerHTML = renderClients();
      else if (tab === 'projects') main.innerHTML = renderProjects();
      else if (tab === 'tasks') main.innerHTML = renderTasks();
      else if (tab === 'invoices') main.innerHTML = renderInvoices();
      else if (tab === 'contracts') main.innerHTML = renderContracts();
      else if (tab === 'briefs') main.innerHTML = renderBriefs();
      else if (tab === 'vault') main.innerHTML = renderVault();
      else if (tab === 'reports') main.innerHTML = renderReports();
      else if (tab === 'settings') main.innerHTML = renderSettings();
      else main.innerHTML = renderOverview();

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openGlobalSearch();
      } else if (e.key === 'Escape') {
        closeGlobalSearch();
        closeModal();
      }
    });

    // Initial boot
    render();
  </script>
</body>
</html>
